    <title>Моя медиатека</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Убираем двойные скроллы */
            background-color: #141414; /* Цвет фона под ваш дизайн */
        }
        iframe {
            width: 100%;
            /* Увеличиваем высоту, чтобы компенсировать сдвиг вверх */
            height: calc(100% + 55px); 
            border: none;
            /* Сдвигаем iframe вверх, пряча плашку Google за пределы экрана */
            margin-top: -55px; 
        }
    </style>
</head>
